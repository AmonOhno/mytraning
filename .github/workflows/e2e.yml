name: E2E

# PR ごとに型チェック + ビルド・lint・E2E を実行する。1 件でも失敗すればジョブは失敗（NG）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint
      # リトライで通った「flaky」も合格扱いにしないよう、リトライなしで全件パスを必須にする
      - name: E2E tests
        run: npm run test:e2e -- --retries=0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
